name: agent-qa-mobile

defaults:
  tools:
    node: "24"

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

on:
  pull_request:
    branches:
      - "*"

jobs:
  fingerprint:
    name: Calculate mobile fingerprints
    type: fingerprint
    environment: preview

  android_get_build:
    name: Find reusable Android build
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: qa-release
      distribution: internal
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  android_repack:
    name: Repack Android build
    needs: [android_get_build]
    if: ${{ needs.android_get_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.android_get_build.outputs.build_id }}
      profile: qa-release
      message: "PR #${{ github.event.pull_request.number }} Android agent QA repack"

  android_build:
    name: Build Android app
    needs: [android_get_build]
    if: ${{ !needs.android_get_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: qa-release
      message: "PR #${{ github.event.pull_request.number }} Android agent QA build"

  ios_get_build:
    name: Find reusable iOS simulator build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: qa-ios-simulator
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  ios_repack:
    name: Repack iOS simulator build
    needs: [ios_get_build]
    if: ${{ needs.ios_get_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.ios_get_build.outputs.build_id }}
      profile: qa-ios-simulator
      message: "PR #${{ github.event.pull_request.number }} iOS agent QA repack"

  ios_build:
    name: Build iOS simulator app
    needs: [ios_get_build]
    if: ${{ !needs.ios_get_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: qa-ios-simulator
      message: "PR #${{ github.event.pull_request.number }} iOS agent QA build"

  qa_android:
    name: Android smoke QA (e2e explore)
    after: [android_repack, android_build]
    if: ${{ after.android_repack.status == 'success' || after.android_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium-nested-virtualization
    outputs:
      status: ${{ steps.run_explore.outputs.status }}
      status_label: ${{ steps.run_explore.outputs.status_label }}
      top_issue: ${{ steps.run_explore.outputs.top_issue }}
      screenshots_cell: ${{ steps.run_explore.outputs.screenshots_cell }}
      section_body: ${{ steps.run_explore.outputs.section_body }}
    env:
      BUILD_ID: ${{ after.android_repack.outputs.build_id || after.android_build.outputs.build_id }}
      PR_JSON: ${{ toJSON(github.event.pull_request) }}
      E2E_BLOB_PREFIX: pr-${{ github.event.pull_request.number }}/android
      CI: "1"
      E2E_DEVICE: emulator-5554
    steps:
      - uses: eas/checkout
      - id: install_e2e
        run: |
          npm ci --prefix ./e2e
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [apk]
      - uses: eas/start_android_emulator
        with:
          system_image_package: system-images;android-35;google_apis;x86_64
      - id: install_app
        run: |
          adb install -r "${{ steps.download_build.outputs.artifact_path }}"
      - id: run_explore
        working_directory: ./e2e
        run: |
          bash ./scripts/explore-and-export.sh android
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: e2e-explore-android
          path: e2e/.e2e-explore

  qa_ios:
    name: iOS smoke QA (e2e explore)
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: macos-medium
    outputs:
      status: ${{ steps.run_explore.outputs.status }}
      status_label: ${{ steps.run_explore.outputs.status_label }}
      top_issue: ${{ steps.run_explore.outputs.top_issue }}
      screenshots_cell: ${{ steps.run_explore.outputs.screenshots_cell }}
      section_body: ${{ steps.run_explore.outputs.section_body }}
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      PR_JSON: ${{ toJSON(github.event.pull_request) }}
      E2E_BLOB_PREFIX: pr-${{ github.event.pull_request.number }}/ios
      CI: "1"
    steps:
      - uses: eas/checkout
      - id: install_e2e
        run: |
          npm ci --prefix ./e2e
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: boot_simulator
        run: |
          bash ./e2e/scripts/boot-ios-simulator.sh "${{ steps.download_build.outputs.artifact_path }}"
      - id: run_explore
        working_directory: ./e2e
        run: |
          bash ./scripts/explore-and-export.sh ios
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: e2e-explore-ios
          path: e2e/.e2e-explore

  e2e_android:
    name: Android e2e tests
    after: [android_repack, android_build]
    if: ${{ after.android_repack.status == 'success' || after.android_build.status == 'success' }}
    environment: preview
    runs_on: linux-medium-nested-virtualization
    outputs:
      status_label: ${{ steps.run_e2e.outputs.status_label }}
      counts: ${{ steps.run_e2e.outputs.counts }}
      summary: ${{ steps.run_e2e.outputs.summary }}
    env:
      BUILD_ID: ${{ after.android_repack.outputs.build_id || after.android_build.outputs.build_id }}
      E2E_BLOB_PREFIX: pr-${{ github.event.pull_request.number }}/android-tests
      CI: "1"
      E2E_DEVICE: emulator-5554
    steps:
      - uses: eas/checkout
      - id: install_e2e
        run: |
          npm ci --prefix ./e2e
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [apk]
      - uses: eas/start_android_emulator
        with:
          system_image_package: system-images;android-35;google_apis;x86_64
      - id: install_app
        run: |
          adb install -r "${{ steps.download_build.outputs.artifact_path }}"
      - id: run_e2e
        working_directory: ./e2e
        run: |
          bash ./scripts/run-and-export.sh android
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: e2e-android
          path: e2e/.e2e

  e2e_ios:
    name: iOS e2e tests
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: macos-medium
    outputs:
      status_label: ${{ steps.run_e2e.outputs.status_label }}
      counts: ${{ steps.run_e2e.outputs.counts }}
      summary: ${{ steps.run_e2e.outputs.summary }}
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      E2E_BLOB_PREFIX: pr-${{ github.event.pull_request.number }}/ios-tests
      CI: "1"
    steps:
      - uses: eas/checkout
      - id: install_e2e
        run: |
          npm ci --prefix ./e2e
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: boot_simulator
        run: |
          bash ./e2e/scripts/boot-ios-simulator.sh "${{ steps.download_build.outputs.artifact_path }}"
      - id: run_e2e
        working_directory: ./e2e
        run: |
          bash ./scripts/run-and-export.sh ios
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: e2e-ios
          path: e2e/.e2e

  qa_comment:
    name: Comment on PR
    after: [qa_android, qa_ios, e2e_android, e2e_ios]
    if: ${{ always() && github.event_name == 'pull_request' }}
    type: github-comment
    params:
      payload: |
        ## Smoke QA (e2e explore)

        | Platform | Status | Top finding |
        | --- | --- | --- |
        | Android | ${{ after.qa_android.outputs.status_label || '⛔ blocked' }} | ${{ after.qa_android.outputs.top_issue || 'No Android QA report was produced.' }} |
        | iOS | ${{ after.qa_ios.outputs.status_label || '⛔ blocked' }} | ${{ after.qa_ios.outputs.top_issue || 'No iOS QA report was produced.' }} |

        ### Screenshots

        | Android | iOS |
        | --- | --- |
        | ${{ after.qa_android.outputs.screenshots_cell || 'N/A' }} | ${{ after.qa_ios.outputs.screenshots_cell || 'N/A' }} |

        ### e2e tests

        | Platform | Status | Tests |
        | --- | --- | --- |
        | Android | ${{ after.e2e_android.outputs.status_label || '⛔ blocked' }} | ${{ after.e2e_android.outputs.counts || 'N/A' }} |
        | iOS | ${{ after.e2e_ios.outputs.status_label || '⛔ blocked' }} | ${{ after.e2e_ios.outputs.counts || 'N/A' }} |

        <details>
        <summary>Android e2e summary</summary>

        ${{ after.e2e_android.outputs.summary || 'No Android e2e summary was produced.' }}
        </details>

        <details>
        <summary>iOS e2e summary</summary>

        ${{ after.e2e_ios.outputs.summary || 'No iOS e2e summary was produced.' }}
        </details>

        <details>
        <summary>Full Android Report</summary>

        ${{ after.qa_android.outputs.section_body || '### Android\n\n**Status:** ⛔ blocked\n\nNo Android QA section was produced.\n' }}
        </details>

        <details>
        <summary>Full iOS Report</summary>

        ${{ after.qa_ios.outputs.section_body || '### iOS\n\n**Status:** ⛔ blocked\n\nNo iOS QA section was produced.\n' }}
        </details>
